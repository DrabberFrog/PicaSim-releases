name: Build Windows ARM64

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - '.gitignore'

jobs:
  build-arm64-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install vcpkg packages (ARM64)
        shell: cmd
        run: |
          vcpkg install glad:arm64-windows

      - name: Configure CMake for Windows ARM64
        shell: cmd
        run: |
          cmake -B build-win-arm64 ^
            -G "Visual Studio 17 2022" ^
            -A ARM64 ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DPICASIM_ENABLE_VR=OFF ^
            -DCMAKE_TOOLCHAIN_FILE="%VCPKG_INSTALLATION_ROOT%/scripts/buildsystems/vcpkg.cmake" ^
            -DVCPKG_TARGET_TRIPLET=arm64-windows

      - name: Build PicaSim
        shell: cmd
        run: |
          cmake --build build-win-arm64 --config Release --parallel

      - name: Bundle Release
        shell: bash
        run: |
          mkdir -p dist-win-arm64
          cp build-win-arm64/Release/PicaSim.exe dist-win-arm64/ 2>/dev/null || cp build-win-arm64/bin/Release/PicaSim.exe dist-win-arm64/
          cp -r data dist-win-arm64/
          cp LICENSE.txt dist-win-arm64/
          cd dist-win-arm64
          7z a ../PicaSim-1.4.0-windows-arm64.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PicaSim-1.4.0-windows-arm64
          path: PicaSim-1.4.0-windows-arm64.zip
